<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decision Simulator Platform - 35 Truyện & AI Trợ Lý</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #1e293b;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar Menu */
        sidebar {
            width: 280px;
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }
        .logo h1 {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
        }
        .logo p {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 24px;
        }
        .menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        .menu-list li {
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            color: #475569;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .menu-list li:hover, .menu-list li.active {
            background: #eff6ff;
            color: #2563eb;
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
            overflow: hidden;
        }
        .topbar {
            padding: 16px 32px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .story-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        .story-card {
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }
        .badge {
            background: #eff6ff;
            color: #2563eb;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 12px;
        }
        h2 { font-size: 24px; color: #0f172a; margin-bottom: 16px; }
        p { font-size: 15px; color: #334155; margin-bottom: 20px; line-height: 1.7; }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .choice-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 14px 20px;
            border-radius: 10px;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
        }
        .choice-btn:hover {
            background: #eff6ff;
            border-color: #3b82f6;
            color: #1d4ed8;
        }

        /* AI Assistant Widget */
        .ai-widget {
            width: 320px;
            background: #ffffff;
            border-left: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }
        .ai-header {
            padding: 16px;
            background: #1e293b;
            color: white;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ai-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            font-size: 13px;
            color: #475569;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .ai-msg {
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.4;
        }
        .ai-msg.user {
            background: #2563eb;
            color: white;
            align-self: flex-end;
        }
        .ai-input-area {
            padding: 12px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
        }
        .ai-input-area input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .ai-input-area button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Sidebar danh mục truyện -->
    <sidebar>
        <div class="logo">
            <h1>DECISION SIMULATOR</h1>
            <p>Hệ thống 35+ Cốt truyện Đa tầng</p>
        </div>
        <ul class="menu-list" id="story-menu">
            <!-- Sinh tự động danh sách 35 truyện -->
        </ul>
    </sidebar>

    <!-- Main Content Area -->
    <main>
        <div class="topbar">
            <span id="tier-label" style="font-size: 14px; font-weight: 600; color: #475569;">Trạng thái: Tầng 1 / 5</span>
            <span style="font-size: 12px; background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 12px; font-weight: 600;">Interactive Simulation</span>
        </div>
        
        <div class="story-container">
            <div class="story-card" id="story-card-box">
                <!-- Nội dung cốt truyện sẽ cập nhật động ở đây -->
            </div>
        </div>
    </main>

    <!-- Khung Chat AI Tích Hợp Riêng Về Dự Án -->
    <div class="ai-widget">
        <div class="ai-header">
            <span>✨ Trợ lý AI Simulator</span>
        </div>
        <div class="ai-messages" id="aiMessages">
            <div class="ai-msg">Chào bạn! Tôi là trợ lý AI chuyên biệt cho nền tảng mô phỏng quyết định. Bạn muốn thảo luận về tâm lý nhân vật hay cần gợi ý nhánh rẽ qua 5 tầng không? Cứ hỏi tôi nhé!</div>
        </div>
        <div class="ai-input-area">
            <input type="text" id="aiInput" placeholder="Nhập câu hỏi cho AI..." onkeypress="handleAIKey(event)">
            <button onclick="sendAIMessage()">Gửi</button>
        </div>
    </div>

    <script>
        // Cơ sở dữ liệu tự động sinh 35 truyện, mỗi truyện đủ 5 tầng lựa chọn
        const storiesDatabase = {};
        const titles = [
            "Ngã Rẽ Bàn Ăn Tối", "Áp Lực Kỳ Thi Chuyên", "Robot Cứu Hỏa STEM", "Talkshow Đồi A1",
            "Bản Án Phòng Kín", "Tiệm Cầm Đồ Xuyên Không", "Đêm Trực Trường Ma Quái", "Hợp Đồng Hôn Nhân Giả",
            "Chuyến Tàu 23h59", "Bí Mật Dưới Lòng Đất", "Nữ Doanh Nhân Thương Cảng", "Hành Trình Lập Nghiệp",
            "Đội Tuyển Quốc Gia", "Thuật Toán Định Mệnh", "Phi Vụ Công Nghệ Cao", "Ký Ức Đóng Hộp",
            "Bức Thư Nặc Danh", "Ngôi Làng Sương Mù", "Học Sinh Chuyển Trường", "Tiếng Gọi Từ Quá Khứ",
            "Mật Mã Hoàng Thành", "Bẫy Ngầm Đô Thị", "Thám Tử Tư Bất Đắc Dĩ", "Bản Phác Họa Tử Thần",
            "Tiệm Trà Sữa Xuyên Không", "Cung Đấu Trận Đồ", "Thế Giới Giả Lập K", "Tận Thế Đột Biến",
            "Săn Lùng Quái Vật", "Học Viện Phép Thuật", "Hành Trình Săn Học Bổng", "Bí Ẩn Vùng Đất Cấm",
            "Bản Thiết Kế Cuối Cùng", "Kế Hoạch Khởi Nghiệp", "Chương Cuối Cuộc Đời"
        ];

        for (let i = 1; i <= 35; i++) {
            let sId = 'story' + i;
            storiesDatabase[sId] = {
                title: titles[i-1] || ("Cốt truyện số " + i),
                tier1: {
                    tier: "Tầng 1 / 5: Khởi đầu thử thách",
                    text: `Tình huống bắt đầu của câu chuyện ${titles[i-1]}. Bạn đối mặt với một quyết định mang tính bước ngoặt định hình tương lai.`,
                    choices: [
                        { text: "Lựa chọn A: Dấn thân đối mặt trực diện với thử thách.", next: "tier2_A" },
                        { text: "Lựa chọn B: Lựa chọn con đường an toàn hơn.", next: "tier2_B" }
                    ]
                },
                tier2_A: {
                    tier: "Tầng 2 / 5: Diễn biến phức tạp",
                    text: "Hệ quả từ lựa chọn ban đầu đẩy bạn vào tình thế khó khăn đòi hỏi sự quyết đoán cao độ.",
                    choices: [
                        { text: "Lựa chọn A1: Kiên định với mục tiêu đề ra.", next: "tier3_A1" },
                        { text: "Lựa chọn A2: Thay đổi chiến thuật linh hoạt.", next: "tier3_A2" }
                    ]
                },
                tier2_B: {
                    tier: "Tầng 2 / 5: Góc nhìn mới",
                    text: "Con đường an toàn giúp bạn tránh rủi ro trước mắt nhưng mở ra một nút thắt bất ngờ khác.",
                    choices: [
                        { text: "Lựa chọn B1: Tận dụng cơ hội bứt phá.", next: "tier3_A1" },
                        { text: "Lựa chọn B2: Quan sát thêm tình hình.", next: "tier3_A2" }
                    ]
                },
                tier3_A1: {
                    tier: "Tầng 3 / 5: Đỉnh điểm cao trào",
                    text: "Tình huống lên cao trào khi các bên liên quan yêu cầu câu trả lời rõ ràng.",
                    choices: [
                        { text: "Lựa chọn A1-1: Dùng tư duy sắc bén giải quyết triệt để.", next: "tier4_A1" },
                        { text: "Lựa chọn A1-2: Tìm kiếm sự trợ giúp từ đồng đội.", next: "tier4_A1" }
                    ]
                },
                tier3_A2: {
                    tier: "Tầng 3 / 5: Ngã rẽ hiểm nghèo",
                    text: "Sự thay đổi chiến thuật mang lại kết quả trái chiều, đòi hỏi tinh thần thép.",
                    choices: [
                        { text: "Lựa chọn A2-1: Đánh cược nước cuối cùng.", next: "tier4_A1" },
                        { text: "Lựa chọn A2-2: Rút lui an toàn.", next: "tier4_A1" }
                    ]
                },
                tier4_A1: {
                    tier: "Tầng 4 / 5: Cận kề vạch đích",
                    text: "Mọi nỗ lực và kiên trì qua các tầng trước đã kết tinh thành cơ hội thành công.",
                    choices: [
                        { text: "🏆 Tiến thẳng tới cái kết vinh quang đỉnh cao!", next: "tier5_WIN" },
                        { text: "⭐ Chấp nhận cái kết mở đầy bất ngờ.", next: "tier5_WIN" }
                    ]
                },
                tier5_WIN: {
                    tier: "Tầng 5 / 5: Hoàn thành xuất sắc",
                    text: `Chúc mừng bạn đã hoàn thành xuất sắc toàn bộ 5 tầng quyết định của cốt truyện "${titles[i-1]}"!`,
                    choices: [
                        { text: "🔄 Quay lại tầng 1 khởi động lại", next: "tier1" }
                    ]
                }
            };
        }

        let currentStoryId = 'story1';

        // Render danh mục menu bên trái
        const menuEl = document.getElementById('story-menu');
        for (let i = 1; i <= 35; i++) {
            let sId = 'story' + i;
            let li = document.createElement('li');
            li.innerText = `${i}. ${storiesDatabase[sId].title}`;
            if(i === 1) li.classList.add('active');
            li.onclick = () => {
                document.querySelectorAll('.menu-list li').forEach(el => el.classList.remove('active'));
                li.classList.add('active');
                currentStoryId = sId;
                renderNode('tier1');
            };
            menuEl.appendChild(li);
        }

        function renderNode(nodeKey) {
            const story = storiesDatabase[currentStoryId];
            const node = story[nodeKey];
            const cardBox = document.getElementById('story-card-box');
            document.getElementById('tier-label').innerText = `Trạng thái: ${node.tier}`;

            let choicesHtml = '';
            node.choices.forEach(c => {
                choicesHtml += `<button class="choice-btn" onclick="renderNode('${c.next}')">${c.text}</button>`;
            });

            cardBox.innerHTML = `
                <span class="badge">${story.title}</span>
                <h2>${node.tier}</h2>
                <p>${node.text}</p>
                <div class="choices">${choicesHtml}</div>
            `;
        }

        // Khởi chạy mặc định truyện 1
        renderNode('tier1');

        // Logic Chat AI Trợ Lý tích hợp
        function handleAIKey(e) {
            if (e.key === 'Enter') sendAIMessage();
        }

        function sendAIMessage() {
            const input = document.getElementById('aiInput');
            const txt = input.value.trim();
            if(!txt) return;

            const box = document.getElementById('aiMessages');
            box.innerHTML += `<div class="ai-msg user">${txt}</div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;

            setTimeout(() => {
                let reply = "Hệ thống mô phỏng 35 cốt truyện qua 5 tầng đòi hỏi bạn phải cân nhắc kỹ các hệ quả ở từng ngã rẽ. Hãy thử thay đổi lựa chọn để xem các kết cục khác nhé!";
                const low = txt.toLowerCase();
                if(low.includes('gợi ý') || low.includes('chọn gì')) {
                    reply = "Để đạt kết cục thắng lợi ở tầng 5, các lựa chọn hướng về sự chủ động và kiên định thường mang lại điểm số cao nhất!";
                } else if(low.includes('chào') || low.includes('hi')) {
                    reply = "Chào bạn! Trợ lý AI luôn sẵn sàng hỗ trợ bạn chinh phục toàn bộ các thử thách trong dự án này.";
                }
                box.innerHTML += `<div class="ai-msg">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
