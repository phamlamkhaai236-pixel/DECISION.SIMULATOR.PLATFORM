<script>
        // Cấu hình API Key của bạn vào đây để AI hoạt động thông minh thực thụ
        const GEMINI_API_KEY = "AQ.Ab8RN6KL2H-wXG17VzAz11IewDocc9yZSRLtczGQYIdZl314GA";

        const fullDatabase = [
            // ... (Giữ nguyên toàn bộ mảng dữ liệu categories & stories hiện tại của bạn ở đây) ...
        ];

        function initHomeView() {
            const container = document.getElementById('all-categories-container');
            container.innerHTML = '';

            fullDatabase.forEach(cat => {
                let cardsHtml = '';
                cat.stories.forEach(st => {
                    cardsHtml += `
                        <div class="story-card" onclick="startSimulation('${st.id}')">
                            <div>
                                <h4>${st.title}</h4>
                                <p>${st.desc}</p>
                            </div>
                            <span class="role-badge">Góc nhìn: ${st.role}</span>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="category-title"><span></span> ${cat.category}</div>
                    <div class="stories-grid">${cardsHtml}</div>
                `;
            });
        }

        let currentActiveStory = null;
        let currentStepIndex = 0;

        function startSimulation(storyId) {
            let found = null;
            fullDatabase.forEach(cat => {
                cat.stories.forEach(st => {
                    if (st.id === storyId) found = st;
                });
            });

            if (!found) return;
            currentActiveStory = found;
            currentStepIndex = 0;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('sim-view').style.display = 'block';
            renderCurrentStage();
        }

        function goHome() {
            currentActiveStory = null;
            currentStepIndex = 0;
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('sim-view').style.display = 'none';
            window.scrollTo(0, 0);
        }

        function restartCurrentStory() {
            currentStepIndex = 0;
            renderCurrentStage();
            window.scrollTo(0, 0);
        }

        function renderCurrentStage() {
            const stage = currentActiveStory.stages[currentStepIndex];

            document.getElementById('stageTitle').innerText = `${currentActiveStory.title} — ${stage.title}`;
            document.getElementById('simText').innerText = stage.text;

            for (let i = 0; i < 5; i++) {
                const dot = document.getElementById(`dot-${i}`);
                dot.className = 'progress-dot';
                if (i < currentStepIndex) dot.classList.add('passed');
                if (i === currentStepIndex) dot.classList.add('active');
            }

            const choicesBox = document.getElementById('choicesList');
            const customInputBox = document.getElementById('customInputBox');
            const resultActions = document.getElementById('resultActions');

            choicesBox.innerHTML = '';

            if (stage.isResult) {
                choicesBox.style.display = 'none';
                customInputBox.style.display = 'none';
                resultActions.style.display = 'flex';
            } else {
                choicesBox.style.display = 'flex';
                customInputBox.style.display = 'flex';
                resultActions.style.display = 'none';

                stage.choices.forEach((choiceText, index) => {
                    choicesBox.innerHTML += `<button class="choice-btn" onclick="advanceStep()">👉 Phương án ${index + 1}: ${choiceText}</button>`;
                });
            }
            document.getElementById('customInput').value = '';
            window.scrollTo(0, 0);
        }

        function advanceStep() {
            if (currentStepIndex < currentActiveStory.stages.length - 1) {
                currentStepIndex++;
                renderCurrentStage();
            }
        }

        function submitCustom() {
            const val = document.getElementById('customInput').value.trim();
            if (!val) {
                alert("Vui lòng nhập phương án xử lý chủ động của bạn!");
                return;
            }
            advanceStep();
        }

        function handleChatKey(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        // TÍCH HỢP TRỢ LÝ AI THÔNG MINH SỬ DỤNG GEMINI API CHÍNH THỨC
        async function sendChatMessage() {
            const inputEl = document.getElementById('chatInput');
            const chatMessages = document.getElementById('chatMessages');
            const text = inputEl.value.trim();
            if (!text) return;

            // Hiển thị tin nhắn người dùng
            chatMessages.innerHTML += `<div class="message user">${text}</div>`;
            inputEl.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Tạo khung chờ phản hồi từ AI
            const aiMsgId = 'ai-msg-' + Date.now();
            chatMessages.innerHTML += `<div class="message ai" id="${aiMsgId}">Trợ lý AI đang phân tích và suy ngẫm...</div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // Gọi API Gemini
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                role: "user",
                                parts: [
                                    {
                                          text: "Bạn là một trợ lý AI chuyên sâu, thấu cảm và thông minh trên nền tảng 'Decision Simulator' (Mô phỏng giải quyết tình huống thực tế, hướng nghiệp, tâm lý học đường, và đời sống giới trẻ). Hãy trò chuyện, đưa ra lời khuyên đa chiều, sâu sắc và đồng hành cùng người dùng dựa trên thông tin sau: " + text
                                    }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                let aiReply = "Xin lỗi bạn, hiện tại hệ thống kết nối AI đang gặp chút gián đoạn. Bạn thử lại sau ít phút nhé!";

                if (data && data.candidates && data.candidates[0].content.parts[0].text) {
                    aiReply = data.candidates[0].content.parts[0].text;
                }

                document.getElementById(aiMsgId).innerText = aiReply;
            } catch (error) {
                console.p(error);
                document.getElementById(aiMsgId).innerText = "Đã xảy ra lỗi kết nối mạng tới trợ lý AI. Vui lòng kiểm tra lại API Key.";
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        initHomeView();
    </script>
